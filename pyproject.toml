[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpf-validator"
version = "0.1.0"
description = "Validate and inspect Raptrix Power Interchange (.rpf) files against schema contract v0.14.5."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pyarrow>=25.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rpf-validate = "rpf_validator.cli:validate_main"
rpf-inspect = "rpf_validator.cli:inspect_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpf_validator = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
